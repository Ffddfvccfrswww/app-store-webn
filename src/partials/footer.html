<footer class="site-footer" id="site-footer">
  <div class="shell site-footer__grid">
    <div class="site-footer__brand">
      <a class="brand" href="index.html" data-i18n-attr="aria-label:a11y.home">
        <svg class="brand__mark" width="28" height="28" aria-hidden="true" focusable="false"><use href="#i-mark"/></svg>
        <span class="brand__name" translate="no">{{brand}}</span>
      </a>
      <p class="site-footer__blurb" data-i18n="footer.blurb"></p>
      <p class="site-footer__disclosure">
        <svg width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-label"/></svg>
        <span data-i18n="footer.adDisclosure"></span>
      </p>
    </div>

    <nav class="site-footer__nav" data-i18n-attr="aria-label:a11y.footerNav">
      <div class="site-footer__col">
        <h2 class="site-footer__heading" data-i18n="footer.site"></h2>
        <ul>
          <li><a href="index.html#showing" data-i18n="nav.showing"></a></li>
          <li><a href="index.html#production" data-i18n="nav.how"></a></li>
          <li><a href="index.html#tickets" data-i18n="nav.tickets"></a></li>
          <li><a href="index.html#faq" data-i18n="nav.faq"></a></li>
          <li><a href="submit.html" data-i18n="footer.submit"></a></li>
        </ul>
      </div>
      <div class="site-footer__col">
        <h2 class="site-footer__heading" data-i18n="footer.legal"></h2>
        <ul>
          <li><a href="terms.html" data-i18n="footer.terms"></a></li>
          <li><a href="privacy.html" data-i18n="footer.privacy"></a></li>
          <li><a href="cookies.html" data-i18n="footer.cookies"></a></li>
          <li><a href="refunds.html" data-i18n="footer.refunds"></a></li>
          <li><a href="guidelines.html" data-i18n="footer.guidelines"></a></li>
          <li><a href="accessibility.html" data-i18n="footer.accessibility"></a></li>
          <li><a href="legal.html" data-i18n="footer.notice"></a></li>
        </ul>
      </div>
      <div class="site-footer__col">
        <h2 class="site-footer__heading" data-i18n="footer.preferences"></h2>
        <ul>
          <li>
            <button type="button" class="link-btn js-consent-open">
              <svg width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-shield"/></svg>
              <span data-i18n="footer.privacySettings"></span>
            </button>
          </li>
          <li>
            <button type="button" class="link-btn js-motion-toggle" aria-pressed="false">
              <svg class="icon-btn__pause" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-pause"/></svg>
              <svg class="icon-btn__play" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-play"/></svg>
              <span data-i18n="a11y.motionPause"></span>
            </button>
          </li>
        </ul>
      </div>
    </nav>
  </div>

  <div class="shell site-footer__legal">
    <p class="site-footer__trademarks" data-i18n="footer.trademarks"></p>
    <p class="site-footer__rights" data-i18n="footer.rights"></p>
  </div>
</footer>
